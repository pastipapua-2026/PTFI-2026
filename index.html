<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#182338">
<title>PASTI-Papua | Weekly Update PTFI</title>
<meta name="description" content="Laporan mingguan PASTI-Papua untuk PT Freeport Indonesia: kegiatan, partisipan, dan capaian indikator di Mimika, Nabire, dan Asmat.">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>/* cadangan: tetap rapi bila folder assets belum ter-upload */
body.locked .top,body.locked main,body.locked .pager,.pbar-fs{display:none}
#gate{font-family:Inter,system-ui,sans-serif}
.org img{max-height:40px;width:auto}.org .org-txt{display:none}
</style>
<link rel="stylesheet" href="./assets/dashboard.css?v=wu3">
<link rel="stylesheet" href="./assets/weekly.css?v=wu3">
</head>
<body class="locked">
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gTitle">
  <form class="gate-box panel" id="gForm" autocomplete="off">
    <span class="org g-org"><img src="./assets/logo-wvi.png" alt="Wahana Visi Indonesia" onerror="this.parentNode.classList.add('nologo')"><span class="org-txt">Wahana Visi Indonesia</span></span>
    <div class="brand"><span class="hb-badge" aria-hidden="true">P</span><div class="ttl"><h1 id="gTitle">PASTI-Papua <span>· Weekly Update PTFI</span></h1><p>Mimika · Nabire · Asmat</p></div></div>
    <p class="g-sub">Masukkan kode akses untuk membuka laporan mingguan.</p>
    <label class="g-lab" for="gCode">Kode akses</label>
    <input id="gCode" type="password" required autocomplete="off" spellcheck="false">
    <button id="gBtn" class="ibtn pri" type="submit">Buka laporan</button>
    <div class="g-err" id="gErr" role="status" aria-live="polite"></div>
    <small class="g-foot">Didanai PT Freeport Indonesia · dilaksanakan Wahana Visi Indonesia</small>
  </form>
</div>

<header class="top" inert>
  <div class="top-in">
    <div class="brand">
      <span class="hb-badge" aria-hidden="true">P</span>
      <div class="ttl"><h1>PASTI-Papua <span>· Weekly Update PTFI</span></h1><p id="asof">Mimika · Nabire · Asmat</p></div>
      <span class="org h-org"><img src="./assets/logo-wvi.png" alt="Wahana Visi Indonesia" onerror="this.parentNode.classList.add('nologo')"><span class="org-txt">Wahana Visi Indonesia</span></span>
    </div>
    <div class="ctrl">
      <div class="fxs"><label for="per">Minggu laporan</label><select id="per" class="sel"></select></div>
      <div class="tg" role="group" aria-label="Mode tampilan">
        <button data-theme-set="light" aria-label="Mode terang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button data-theme-set="dark" aria-label="Mode gelap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      </div>
      <button class="ibtn" id="print" aria-label="Cetak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M7 14h10v7H7z"/></svg></button>
      <button class="ibtn pri" id="present" aria-label="Mulai presentasi layar penuh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Presentasi</span></button>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Bagian" id="tabs"></nav>
</header>

<main id="main" inert></main>
<div class="pager" inert><button id="prev"></button><button id="next"></button></div>
<div class="pbar-fs" aria-label="Kontrol presentasi">
  <button class="arr" id="fsPrev" aria-label="Bagian sebelumnya">‹</button>
  <span class="fs-lab" id="fsLab"></span>
  <button class="arr" id="fsNext" aria-label="Bagian berikutnya">›</button>
  <button class="ibtn" id="fsExit" aria-label="Keluar dari presentasi">Keluar</button>
</div>

<script src="./assets/logic.js?v=wu3"></script>
<script src="./assets/app.js?v=wu3"></script>
<script>
/* Pemeriksaan upload: bila berkas di folder assets tidak ada, tampilkan pesan yang jelas di halaman kode akses. */
addEventListener('load', function () {
  var miss = [], g = document.getElementById('gate'), b = document.querySelector('.hb-badge');
  if (!window.WU) miss.push('assets/logic.js');
  if (typeof unlock !== 'function') miss.push('assets/app.js');
  if (g && getComputedStyle(g).position !== 'fixed') miss.push('assets/weekly.css');
  if (b && getComputedStyle(b).display !== 'flex') miss.push('assets/dashboard.css (versi baru)');
  if (!miss.length) return;
  var e = document.getElementById('gErr');
  e.style.cssText = 'color:#bd3a0b;font-weight:700;margin-top:10px;max-width:520px';
  e.textContent = 'Laporan belum lengkap ter-upload. Berkas berikut tidak ditemukan di repository: ' + miss.join(', ') + '. Upload ulang folder assets (lihat PANDUAN_SETUP.md, langkah 2).';
  document.getElementById('gBtn').disabled = true;
});
</script>
</body>
</html>
